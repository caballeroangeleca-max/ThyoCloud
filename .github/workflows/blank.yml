name: RDP

on:
  workflow_dispatch:

env:
  GAME_LINK: "https://drive.google.com/drive/folders/18Q4_tkFbHlEcdUkCvoVRjNBY4wxi5fVG"
  RCLONE_CONFIG: C:\rclone.conf

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check secrets
        env:
          P: ${{ secrets.RDP_PASSWORD }}
          K: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:P) { Write-Error "Secret RDP_PASSWORD belum diisi"; exit 1 }
          if (-not $env:K) { Write-Error "Secret TAILSCALE_AUTH_KEY belum diisi"; exit 1 }

      - name: Enable RDP
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          netsh advfirewall firewall delete rule name="RDP-Any" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Any" dir=in action=allow protocol=TCP localport=3389 profile=any
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

      - name: Create RDP user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $user = "JoyWardana"
          $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $user -Password $pass
          } else {
            New-LocalUser -Name $user -Password $pass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          Remove-Item $msi -Force
          Start-Sleep -Seconds 10

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          Write-Host "======================================"
          Write-Host "RDP ke  : $ip"
          Write-Host "User    : JoyWardana"
          Write-Host "Game    : C:\Games\game"
          Write-Host "Saves   : C:\Persist\Saves"
          Write-Host "======================================"

      - name: Siapkan folder
        run: |
          New-Item -ItemType Directory -Force -Path C:\Games, C:\Persist\Saves | Out-Null

      - name: Download game dari Google Drive
        run: |
          pip install gdown --quiet
          if ($env:GAME_LINK -match "/folders/") {
            gdown --folder "$env:GAME_LINK" -O C:\Games\game
          } else {
            gdown --fuzzy "$env:GAME_LINK" -O C:\Games\game.zip
            if ($LASTEXITCODE -eq 0 -and (Test-Path C:\Games\game.zip)) {
              try { Expand-Archive C:\Games\game.zip -DestinationPath C:\Games\game -Force; Remove-Item C:\Games\game.zip }
              catch { Write-Host "Bukan file zip, dibiarkan apa adanya" }
            }
          }
          Get-ChildItem C:\Games\game -ErrorAction SilentlyContinue | Format-Table Name,Length

      - name: Restore save dari Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if (-not $env:RCLONE_CONF) { Write-Host "RCLONE_CONF kosong, sync save dilewati"; exit 0 }
          $env:RCLONE_CONF | Out-File -Encoding ascii C:\rclone.conf
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile $env:TEMP\rclone.zip
          Expand-Archive $env:TEMP\rclone.zip -DestinationPath $env:TEMP\rc -Force
          Copy-Item (Get-ChildItem $env:TEMP\rc -Recurse -Filter rclone.exe | Select-Object -First 1).FullName C:\rclone.exe
          & C:\rclone.exe copy gdrive:RDP-Saves C:\Persist\Saves --progress

      - name: Keep alive
        run: |
          # Buat file C:\stop.txt lewat RDP untuk berhenti dan menyimpan save
          $end = (Get-Date).AddMinutes(335)
          while ((Get-Date) -lt $end -and -not (Test-Path "C:\stop.txt")) { Start-Sleep -Seconds 30 }

      - name: Upload save ke Google Drive
        if: always()
        run: |
          if (-not (Test-Path C:\rclone.exe)) { Write-Host "rclone tidak ada, dilewati"; exit 0 }
          & C:\rclone.exe copy C:\Persist\Saves gdrive:RDP-Saves --progress
