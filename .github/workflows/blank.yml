name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check secrets
        env:
          P: ${{ secrets.RDP_PASSWORD }}
          K: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:P) { Write-Error "Secret RDP_PASSWORD belum diisi"; exit 1 }
          if (-not $env:K) { Write-Error "Secret TAILSCALE_AUTH_KEY belum diisi"; exit 1 }

      - name: Enable RDP + izinkan storage HP
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $ts -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty -Path $ts -Name fDisableCdm -Value 0 -Force
          Set-ItemProperty -Path "$ts\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1 -Force
          Set-ItemProperty -Path "$ts\WinStations\RDP-Tcp" -Name fDisableCdm -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          netsh advfirewall firewall delete rule name="RDP-Any" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Any" dir=in action=allow protocol=TCP localport=3389 profile=any
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

      - name: Create RDP user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $user = "JoyWardana"
          $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $user -Password $pass
          } else {
            New-LocalUser -Name $user -Password $pass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

      - name: Siapkan sync HP
        run: |
          New-Item -ItemType Directory -Force -Path C:\RDPTools, C:\GameSaves, D:\MT2 | Out-Null
          icacls C:\GameSaves /grant "Everyone:(OI)(CI)F" | Out-Null
          icacls D:\MT2 /grant "Everyone:(OI)(CI)F" | Out-Null
          icacls C:\RDPTools /grant "Everyone:(OI)(CI)F" | Out-Null

          $script = @'
          param([string]$Mode = 'loop')
          $game = 'D:\MT2'
          $save = 'C:\GameSaves'
          $log  = 'C:\RDPTools\sync.log'
          function Log($m) { "$(Get-Date -Format 'HH:mm:ss') $m" | Add-Content $log }

          function Get-Mt2 {
            $base = (Get-ChildItem '\\tsclient' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            if (-not $base) { return $null }
            if (Test-Path "$base\MT2") { return "$base\MT2" }
            $f = Get-ChildItem $base -Directory -Recurse -Depth 3 -Filter MT2 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { return $f.FullName }
            return $null
          }

          function Wait-Phone {
            while ($true) {
              $m = Get-Mt2
              if ($m) { return $m }
              Log "Folder MT2 di HP belum ketemu, coba lagi..."
              Start-Sleep -Seconds 10
            }
          }

          $mt2 = Wait-Phone
          $phoneSaves = Join-Path (Split-Path $mt2 -Parent) 'MT2_Saves'
          New-Item -ItemType Directory -Force -Path $phoneSaves | Out-Null
          Log "MT2 = $mt2 | Saves HP = $phoneSaves"

          switch ($Mode) {
            'game' { robocopy $mt2 $game /E /R:1 /W:1 /NP | Out-Null; Log "Game disalin ke $game" }
            'pull' { robocopy $phoneSaves $save /E /R:1 /W:1 /NP | Out-Null; Log "Save diambil dari HP" }
            'push' { robocopy $save $phoneSaves /E /R:1 /W:1 /NP | Out-Null; Log "Save dikirim ke HP" }
            'loop' {
              robocopy $phoneSaves $save /E /R:1 /W:1 /NP | Out-Null
              Log "Save lama dipulihkan, autosave jalan tiap 2 menit"
              while ($true) {
                Start-Sleep -Seconds 120
                if (Test-Path $phoneSaves) {
                  robocopy $save $phoneSaves /E /R:1 /W:1 /NP | Out-Null
                  Log "Autosave ke HP"
                }
              }
            }
          }
          '@
          $script | Set-Content -Path C:\RDPTools\sync.ps1 -Encoding UTF8

          Set-Content -Path C:\Users\Public\Desktop\Ambil-Game.bat -Value "@echo off`r`npowershell -ExecutionPolicy Bypass -File C:\RDPTools\sync.ps1 -Mode game`r`necho Selesai. Game ada di D:\MT2`r`npause"
          Set-Content -Path C:\Users\Public\Desktop\Simpan-Save.bat -Value "@echo off`r`npowershell -ExecutionPolicy Bypass -File C:\RDPTools\sync.ps1 -Mode push`r`necho Save sudah dikirim ke HP`r`npause"

          $a  = New-ScheduledTaskAction -Execute powershell.exe -Argument '-WindowStyle Hidden -ExecutionPolicy Bypass -File C:\RDPTools\sync.ps1 -Mode loop'
          $t  = New-ScheduledTaskTrigger -AtLogOn -User JoyWardana
          $pr = New-ScheduledTaskPrincipal -UserId JoyWardana -LogonType Interactive
          Register-ScheduledTask -TaskName PhoneSync -Action $a -Trigger $t -Principal $pr -Force | Out-Null

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          Remove-Item $msi -Force
          Start-Sleep -Seconds 10

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          Write-Host "======================================"
          Write-Host "RDP ke : $ip"
          Write-Host "User   : JoyWardana"
          Write-Host "Game   : D:\MT2 (klik Ambil-Game di Desktop)"
          Write-Host "Saves  : C:\GameSaves (autosave ke HP tiap 2 menit)"
          Write-Host "======================================"

      - name: Keep alive
        run: |
          # Buat file C:\stop.txt lewat RDP untuk berhenti
          $end = (Get-Date).AddMinutes(355)
          while ((Get-Date) -lt $end -and -not (Test-Path "C:\stop.txt")) { Start-Sleep -Seconds 30 }
